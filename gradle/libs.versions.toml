[versions]
# The published Kotlin floor, not a build detail: a klib carries the ABI of the compiler that made
# it, so every iOS consumer's toolchain must be at least this *minor* — a 2.4 build is rejected
# outright by anyone still on 2.3. Held on the 2.3 line for that reach (#205 lowered it), the way
# kotlinx builds coroutines with 2.2. Not because of KSP (KSP 2.3.12 runs under KGP 2.4.10 incl. iOS
# targets, measured 2026-09-13) and not for Uuid.generateV7() either (in the stdlib since 2.3.0) —
# raise it only when a fix actually needs 2.4 or the CMP/AGP baselines move to 2.4. The
# `abiValidation` flip a 2.4 bump needs must land WITH the bump, never alone (CONTRIBUTING.md
# "Bumping dependencies"), and re-run fixtures/klib-diamond/run.sh.
# The dependabot ignore in .github/dependabot.yml mirrors this.
kotlin = "2.3.21"
agp = "9.2.1"
# Follows the current stable line (#224): the Android `compileSdk` floor below is whatever this
# version's androidx artifacts declare, so a CMP bump can move it — read the new line's
# `aar-metadata.properties` and the cold-device note in CONTRIBUTING.md before bumping.
composeMultiplatform = "1.12.0"
coroutines = "1.11.0"
serialization = "1.11.0"
atomicfu = "0.33.0"
kotlinxIo = "0.9.1"
analyticsKotlin = "1.26.0"
navigationCompose = "2.9.2"
lifecycle = "2.9.6"
androidxStartup = "1.2.0"
robolectric = "4.17"
androidxFragment = "1.8.9"
androidxComposeUi = "1.7.8"
androidxTestExtJunit = "1.3.0"
androidxTestEspresso = "3.7.0"
androidxTestRunner = "1.7.0"
junit = "4.13.2"
publish = "0.37.0"
dokka = "2.2.0"

# Two published floors, one rule (#224): each becomes `minCompileSdk` in its modules' AAR metadata,
# so it is what a consumer of those modules must compile against, and each sits exactly where its
# own dependencies put it — never higher, never lower. Raise one only when a dependency of a
# *published* module in that group actually demands it; see CONTRIBUTING.md.
# `android-compileSdk` is for the module that draws (`autograph-compose`): androidx Compose 1.12.0,
# which CMP 1.12.0 resolves to, declares `minCompileSdk=37`. A Compose consumer compiles there anyway.
android-compileSdk = "37"
# `android-coreCompileSdk` is for the Android modules that do not draw (`core`, `context`, `segment`,
# `test`, `android`): `androidx.startup` 1.2.0 and `androidx.fragment` 1.8.9 both declare
# `minCompileSdk=34`, and `checkAndroidMainAarMetadata` is transitive through project dependencies,
# so every module that depends on `autograph-core` inherits 34 (measured at 24: `context` fails on
# startup-runtime it never names). Not `android-compileSdk-core` — that path collides with the key above in the
# catalog accessor.
android-coreCompileSdk = "34"
# sample-android only: its own `compileSdk` and `targetSdk`. Deliberately separate so a demo app's
# dependency can never raise a published floor. Nothing else uses this key; sample-shared stays on
# android-compileSdk.
android-sampleCompileSdk = "37"
android-minSdk = "24"
# The iOS floor of Autograph.xcframework, pinned rather than inherited: Kotlin/Native's default
# deployment target moves with the toolchain (2.3.x links at 14.0, 2.4.x at 15.0), so without this
# key a Kotlin bump silently changes what the binary will run on (#208). Package.swift's `.iOS(...)`
# must declare the same value; the swift-package CI job fails when the built slices disagree with
# the manifest (#197). Change both together.
ios-deploymentTarget = "15.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
segment-analytics-android = { module = "com.segment.analytics.kotlin:android", version.ref = "analyticsKotlin" }
jetbrains-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "androidxStartup" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidxFragment" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidxComposeUi" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "androidxComposeUi" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
publish = { id = "com.vanniktech.maven.publish", version.ref = "publish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
