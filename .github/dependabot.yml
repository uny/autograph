version: 2
updates:
  # Gradle dependencies (the Kotlin/AGP/AndroidX/Compose versions in gradle/libs.versions.toml).
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # A Kotlin bump usually needs its ecosystem bumped in lockstep; a single grouped PR keeps them
      # from landing half-applied and breaking the Kotlin/Native + Compose-compiler alignment.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
    ignore:
      # Compose Multiplatform is deliberately held at the 1.11 line: from 1.12.0 its Android
      # artifacts carry `minCompileSdk=37`, and `android-compileSdk` is a published floor that #207
      # lowered to 35 for reach. The bump is otherwise clean (measured 2026-09-12, see #224), so the
      # hold waits for a trigger: androidx compose 1.13 going stable, or the first fix that actually
      # needs 1.12. Drop both entries when raising the floor; re-measure the cold check on whatever
      # CMP version lands.
      - dependency-name: "org.jetbrains.compose*"
        versions: [">=1.12.0"]
      # Same floor, other route: CMP 1.11.1 requires jetbrains lifecycle 2.9.6, so only a catalog
      # value above that can move the resolved version — and the next minors do carry a higher
      # minCompileSdk (2.11.0 took it to 37 before #207). 2.9.x patches still flow. See CONTRIBUTING.md.
      - dependency-name: "org.jetbrains.androidx.lifecycle*"
        versions: [">=2.10.0"]
      # The Kotlin floor is held on the 2.3 line for reach: a klib carries its producing compiler's
      # ABI, so a 2.4 build is rejected outright by every consumer still on a 2.3 toolchain (#205
      # lowered it). It is NOT waiting on KSP — KSP 2.3.12 runs under KGP 2.4.10 incl. iOS targets
      # (measured 2026-09-13) — so the hold ends on a trigger, not a KSP version number: a fix that
      # needs 2.4, or the CMP/AGP baselines moving to 2.4. #212 was the last 2.4.x proposal. Two
      # names on purpose, neither of which is `org.jetbrains.kotlinx*`: the artifact form
      # (`kotlin-test`) and the plugin-id form (`org.jetbrains.kotlin.multiplatform` and friends) are
      # what dependabot actually proposes. Drop both when raising the floor; the `abiValidation` flip
      # must ride in the same PR (CONTRIBUTING.md "Bumping dependencies").
      - dependency-name: "org.jetbrains.kotlin:*"
        versions: [">=2.4.0"]
      - dependency-name: "org.jetbrains.kotlin.*"
        versions: [">=2.4.0"]

  # GitHub Actions used by the CI / CD / docs workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
