name: CD

on:
  push:
    tags:
      - 'v*'

# Two tags pushed close together would otherwise run two of these concurrently, and the
# Package.swift sync at the end of the job is written to defend against exactly that
# interleaving (see the version-ordering tie-break below). Serializing means the tie-break no
# longer has to be load-bearing — it stays anyway, as defence in depth.
#
# All three keys are load-bearing, and two of them guard different runs:
#
#  - `cancel-in-progress: false` protects the *running* release. It may already have published to
#    Maven Central, and `automaticRelease = true` leaves nothing to roll back.
#  - `queue: max` protects the *pending* ones, which that flag does not. The default `single`
#    holds one pending run and cancels it when another arrives, so a third tag would silently drop
#    the second release entirely. `max` queues up to 100 and runs them in order. It cannot be
#    combined with `cancel-in-progress: true`, which is not a constraint here.
#
# actionlint 1.7.12 rejects `queue` as an unknown key for `concurrency` — its schema predates the
# feature, and it is wrong. Verified by having GitHub itself run a throwaway workflow carrying this
# exact block; it was accepted. Worth knowing because this workflow only runs on a release tag, so
# a genuine syntax error here would not surface until a release failed to start.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Pushing the tag is the only gate on this pipeline: `publishToMavenCentral(automaticRelease
      # = true)` leaves no staging repository to inspect or drop, so the next step is already
      # irreversible and a mistyped tag is a published version.
      #
      # The checks live in a script because this workflow runs only on a release tag and so can
      # never be exercised by CI — the script can be, and is, on every PR
      # (validate-release-version.test.sh). The release dry-run workflow calls the same script
      # rather than a copy, so what a dry run validates is what a release validates.
      - name: Validate the release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/validate-release-version.sh "${GITHUB_REF#refs/tags/}"

      # Derived here rather than beside the `gh release create` that consumes it, because it is
      # allowed to fail: a non-zero exit means "we never found out", and the point of failing
      # closed on that is lost if the failure lands *after* the publish. Run late it would abort
      # between the irreversible Maven Central publish and `gh release upload`, leaving the tag's
      # rewritten Package.swift pointing at a release asset that was never uploaded — precisely
      # the half-published state the main-sync step at the end of this job is ordered to avoid.
      # Here, nothing has happened yet and the tag can simply be pushed again.
      #
      # An empty START_TAG is a real answer ("this is the first release"), so it cannot also stand
      # for "the derivation never ran"; DERIVED carries that apart.
      - name: Derive the release-notes start tag
        id: start_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start_tag=$(.github/scripts/derive-release-notes-start-tag.sh "${GITHUB_REF#refs/tags/}")
          {
            echo "START_TAG=$start_tag"
            echo "DERIVED=yes"
          } >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral -Pversion=${{ steps.version.outputs.VERSION }} --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build Autograph.xcframework
        run: ./gradlew :autograph-apple:assembleAutographReleaseXCFramework --stacktrace

      # Kotlin/Native's build output isn't reproducible across separate builds — confirmed by
      # rebuilding the same source on the same machine and observing a different xcframework zip
      # checksum each time. So the checksum can only be known from *this exact* build, not
      # pre-computed and committed ahead of the tag. Self-correct: update Package.swift with the
      # checksum this build actually produced, commit it, and move the tag to point at that
      # commit — the same zip built above is what gets uploaded, so they can never disagree.
      - name: Publish Autograph.xcframework binary target
        id: binary_target
        env:
          GH_TOKEN: ${{ github.token }}
          START_TAG: ${{ steps.start_tag.outputs.START_TAG }}
          DERIVED_START_TAG: ${{ steps.start_tag.outputs.DERIVED }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          zip_path="autograph-apple/build/XCFrameworks/release/Autograph.xcframework.zip"

          (cd autograph-apple/build/XCFrameworks/release && zip -ry Autograph.xcframework.zip Autograph.xcframework)
          checksum=$(swift package compute-checksum "$zip_path")
          echo "CHECKSUM=$checksum" >> "$GITHUB_OUTPUT"

          sed -i '' -E "s/private let releaseVersion = \"[^\"]*\"/private let releaseVersion = \"$version\"/" Package.swift
          sed -i '' -E "s/private let releaseChecksum = \"[^\"]*\"/private let releaseChecksum = \"$checksum\"/" Package.swift

          if ! git diff --quiet -- Package.swift; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Package.swift
            git commit -m "chore: sync Autograph binary target checksum for $tag"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git push origin "HEAD:refs/tags/$tag" --force
          fi

          # --generate-notes with no explicit start tag has picked v0.1.0 as the "previous"
          # release for every tag so far (v0.2.0, v0.3.0, v0.4.0) instead of the actual preceding
          # one, so $START_TAG was derived in an earlier step rather than trusting gh's resolution.
          # The derivation is a script so it can be tested (derive-release-notes-start-tag.test.sh,
          # run on every PR); inline here it could only ever first execute during a release, which
          # is how the resolution this replaced got shipped wrong.
          #
          # An empty $START_TAG means "this is the first release" and is answered below with a
          # plain --generate-notes. An empty $DERIVED_START_TAG means something else entirely: the
          # derivation produced no answer, and reading that as "no previous tag" would fall through
          # to the start-tag-less --generate-notes that #166 removed — the bug itself rather than a
          # degraded version of it. It cannot happen while the step above precedes this one, which
          # is exactly why it is checked: an unset step output is silently the empty string, so a
          # later rewiring would otherwise reinstate #166 without a word.
          #
          # Notes generated this way can still be corrected by hand afterward if they're off
          # (`gh release edit "$tag" --notes-file -` fed from a re-run of the same generate-notes
          # call below).
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if [ "$DERIVED_START_TAG" != yes ]; then
              echo "::error::No release-notes start tag was derived; refusing to guess the range."
              exit 1
            fi

            if [ -n "$START_TAG" ]; then
              gh release create "$tag" --notes-start-tag "$START_TAG" --generate-notes
            else
              gh release create "$tag" --generate-notes
            fi
          fi
          gh release upload "$tag" "$zip_path" --clobber

      # The rewrite above is pushed to refs/tags/<tag> only, so it lands on no branch: main's copy
      # of those two values sat at v0.1.0 through v0.1.1, v0.2.0 and v0.3.0. Replay it onto main so
      # reading Package.swift there doesn't describe a three-releases-old binary. Deliberately the
      # last step in the job — main being briefly stale is cosmetic, whereas failing here before
      # the release assets are up would leave a half-published tag behind.
      - name: Sync Package.swift's binary target onto main
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKSUM: ${{ steps.binary_target.outputs.CHECKSUM }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"

          # An unset step output is the empty string, and the rewrite below would happily commit
          # releaseChecksum = "" onto main and call it a success. Rewiring this input is exactly
          # the mistake that produces that, so check it before touching anything.
          if [ -z "$CHECKSUM" ]; then
            echo "::error::The binary target step exported no checksum; refusing to sync an empty one onto main."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          # main can advance between the fetch and the push (a PR merging mid-release), which is a
          # lost race rather than an error — rebuild the commit on the new tip and try again.
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git checkout -B main-sync origin/main

            # Two tags in flight means two of these steps run, and last-writer-wins would let the
            # slower, older release leave main naming a binary target older than it found. Order
            # the write by version instead of by arrival, so either interleaving ends the same way.
            current=$(sed -nE 's/.*private let releaseVersion = "([^"]*)".*/\1/p' Package.swift)
            if [ "$current" != "$version" ] &&
               [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)" = "$current" ]; then
              echo "main names $current, newer than $tag; leaving it alone."
              exit 0
            fi

            sed -i '' -E "s/private let releaseVersion = \"[^\"]*\"/private let releaseVersion = \"$version\"/" Package.swift
            sed -i '' -E "s/private let releaseChecksum = \"[^\"]*\"/private let releaseChecksum = \"$CHECKSUM\"/" Package.swift

            # sed exits 0 when it matches nothing, so renaming or reformatting either declaration
            # would otherwise read as "already in sync" — or commit half a rewrite if only one
            # matched. Assert the values landed rather than inferring it from a clean diff.
            if ! grep -qF "private let releaseVersion = \"$version\"" Package.swift ||
               ! grep -qF "private let releaseChecksum = \"$CHECKSUM\"" Package.swift; then
              echo "::error::Package.swift on main no longer has the declarations this step rewrites."
              exit 1
            fi

            if git diff --quiet -- Package.swift; then
              echo "main already carries $tag's binary target; nothing to sync."
              exit 0
            fi

            git add Package.swift
            git commit -m "chore: sync Autograph binary target on main for $tag"
            if git push origin HEAD:main; then
              echo "Synced $tag's binary target onto main."
              exit 0
            fi
            echo "main moved while syncing (attempt $attempt of 3); retrying."
          done

          echo "::error::Could not sync Package.swift onto main after 3 attempts. The $tag release itself is complete; main just still names an older release's binary target."
          exit 1
