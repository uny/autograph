name: Docs

# Builds the aggregated Dokka API reference and publishes it to GitHub Pages.
#
# One-time setup: enable Pages with the "GitHub Actions" source under
# Settings → Pages. Until then the deploy job fails harmlessly — it is a separate
# workflow from CI, so it never blocks a PR.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let an in-progress deploy finish rather than cancelling it mid-publish, but only keep one queued.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: macos-latest # matches CI; Dokka analyzes the iOS source sets, though it does not link them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Generate the aggregated API reference
        run: ./gradlew :dokkaGenerate --stacktrace

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/dokka/html

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
