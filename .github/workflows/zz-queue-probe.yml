name: zz queue probe

# TEMPORARY. Deleted before this PR merges. Exists only to make GitHub itself parse a
# `concurrency.queue` key, because actionlint 1.7.12 rejects it as unknown while GitHub's current
# workflow-syntax reference documents it. Whichever one is right decides whether cd.yml is valid,
# and cd.yml only runs on a release tag — so being wrong there would not surface until a release
# failed to start.
on:
  push:
    branches:
      - 167-release-hardening

concurrency:
  group: zz-queue-probe
  cancel-in-progress: false
  queue: max

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "GitHub accepted concurrency.queue"
